const catFilter = document.getElementById('catFilter');
const searchInput = document.getElementById('search');
const tbody = document.getElementById('tbody');
const countEl = document.getElementById('count');
const cardsEl = document.getElementById('cards');

Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([name,c])=>{
  const o = document.createElement('option');
  o.value=name; o.textContent=`${name} — ${c} صنف`;
  catFilter.appendChild(o);
});

let activeCat = 'الكل';
function renderCards(){
  cardsEl.innerHTML='';
  const all = document.createElement('div');
  all.className = `cursor-pointer rounded-xl p-4 border transition ${activeCat==='الكل'?'bg-emerald-500 text-black border-emerald-500':'bg-[#15171e] border-[#2a2e3a] hover:border-emerald-500/50'}`;
  all.innerHTML=`<div class="font-bold">الكل</div><div class="text-2xl font-extrabold mt-1">514</div><div class="text-xs opacity-70 mt-1">كل الأصناف</div>`;
  all.onclick=()=>{activeCat='الكل'; catFilter.value='الكل'; renderCards(); renderTable();};
  cardsEl.appendChild(all);
  Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([name,c])=>{
    const d = document.createElement('div');
    const isActive = activeCat===name;
    d.className = `cursor-pointer rounded-xl p-4 border transition ${isActive?'bg-emerald-500 text-black border-emerald-500':'bg-[#15171e] border-[#2a2e3a] hover:border-emerald-500/50'}`;
    d.innerHTML=`<div class="font-bold text-sm leading-tight line-clamp-2">${name}</div><div class="text-2xl font-extrabold mt-2">${c}</div><div class="text-xs opacity-70 mt-1">صنف متاح</div>`;
    d.onclick=()=>{activeCat=name; catFilter.value=name; renderCards(); renderTable();};
    cardsEl.appendChild(d);
  });
}

function getFiltered(){
  const q = searchInput.value.trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    const matchCat = activeCat==='الكل' || p['Product Category']===activeCat;
    if(!matchCat) return false;
    if(!q) return true;
    return (p['Name']||'').toLowerCase().includes(q) || String(p['Barcode']||'').includes(q);
  });
}

function renderTable(){
  const filtered = getFiltered();
  countEl.textContent = filtered.length;
  tbody.innerHTML='';
  filtered.slice(0,500).forEach((p,i)=>{
    const qty = p['Quantity On Hand'];
    let qtyClass='bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
    if(qty<10) qtyClass='bg-red-500/20 text-red-400 border-red-500/30';
    else if(qty<50) qtyClass='bg-amber-500/20 text-amber-400 border-amber-500/30';
    const tr=document.createElement('tr');
    tr.className='border-b border-[#1f232e] hover:bg-[#1f232e] transition';
    tr.innerHTML=`
      <td class="p-3 text-gray-500">${i+1}</td>
      <td class="p-3"><span class="bg-[#0f1115] border border-[#2a2e3a] px-2 py-1 rounded-lg text-xs">${p['Product Category']}</span></td>
      <td class="p-3 font-medium">${p['Name']}</td>
      <td class="p-3 text-center"><span class="inline-block min-w-[70px] px-3 py-1 rounded-full border font-bold ${qtyClass}">${qty}</span></td>
      <td class="p-3 font-mono text-xs text-gray-400">${p['Barcode']?String(p['Barcode']).replace('.0',''):''}</td>
    `;
    tbody.appendChild(tr);
  });
}

catFilter.addEventListener('change', e=>{activeCat=e.target.value; renderCards(); renderTable();});
searchInput.addEventListener('input', renderTable);
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const data = getFiltered();
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "المتاح");
  XLSX.writeFile(wb, `الاصناف_المتاحة_${activeCat}.xlsx`);
});

renderCards(); renderTable();
</script>
